[pytest]
testpaths = tests
asyncio_mode = auto
# If pytest-homeassistant-custom-component happens to be installed in the
# environment (e.g. alongside other HA custom component work), its
# autouse, session-scoped mock_bluetooth_adapters fixture unconditionally
# patches a Linux-only module and breaks every test outside Linux. This
# suite does not use that harness (see tests/conftest.py), so keep its
# plugin disabled regardless of what else is installed.
addopts = -p no:homeassistant
