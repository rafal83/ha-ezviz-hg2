name: Bug report
description: Report an integration problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I use the latest release.
          required: true
        - label: I have removed passwords, tokens, verification codes, and personal data.
          required: true
  - type: input
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    attributes:
      label: Device model and firmware
      placeholder: HG2 or CH3, firmware version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted logs
      render: text
  - type: textarea
    attributes:
      label: Additional context
